<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/assets/css/signUpStyle.scss" />
    <title>Академия программирования КиберКуб</title>
  </head>
  <body>
    <section id="sign-up">
      <div class="sign-up">
        <form class="sign-up_form" id="tgForm">
          <h2>АКАДЕМИЯ <br />КИБЕРКУБ</h2>
          <h3>ЗАПИСЬ НА ЗАНЯТИЯ</h3>
          <div class="form_input-container">
            <img src="/assets/images/name-unactive.png" width="35px" height="35px" class="name-icon"></img>
            <input
              type="text"
              placeholder="Ваше полное имя"
              class="input-container_input"
              id="fullName"
            />
          </div>
          <div class="form_input-container">
            <img src="/assets/images/phone-unactive.png" width="35px" height="35px" class="phone-icon"></img>
            <input
              type="text"
              placeholder="Ваш номер телефона"
              class="input-container_input"
              id="phone"
            />
          </div>
          <button class="form_button">Отправить заявку</button>
          <div id="statusMessage" class="status"></div>
        </form>
      </div>
    </section>

    <script src="/assets/js/app.js"></script>
  </body>
</html>
